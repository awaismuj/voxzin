worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  server_tokens off;
  client_max_body_size 6m;          # uploads are capped at 5 MB in the API
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  send_timeout 30s;

  # Real client IP from Cloudflare (file generated by infrastructure/scripts/update-cloudflare-ips.sh)
  include /etc/nginx/cloudflare-ips.conf;
  real_ip_header CF-Connecting-IP;

  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

  upstream web { server web:3000; keepalive 16; }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/origin.pem;      # Cloudflare Origin CA cert; set SSL mode to Full (strict)
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/v1/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://web;
      include /etc/nginx/proxy-common.conf;
    }
    location / {
      limit_req zone=general burst=40 nodelay;
      proxy_pass http://web;
      include /etc/nginx/proxy-common.conf;
    }
  }
}
