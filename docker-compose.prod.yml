# Production stack. MongoDB is expected to be managed/private (set MONGODB_URI in .env.production).
# Public traffic: Cloudflare -> host Nginx (80/443) -> web on 127.0.0.1:13006 -> api.
name: strongpassweb

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  web:
    <<: *hardened
    image: voxzin-web:${IMAGE_TAG:-latest}
    pull_policy: never
    env_file: .env.production
    environment:
      API_URL: http://api:4000/v1
    ports:
      - "127.0.0.1:13006:3000"
    tmpfs: ["/tmp", "/app/apps/web/.next/cache"]
    depends_on: [api]
    networks: [app]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  uploads-init:
    image: voxzin-api:${IMAGE_TAG:-latest}
    pull_policy: never
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["chown"]
    command: ["node:node", "/data/uploads"]
    volumes: ["uploads:/data/uploads"]

  api:
    <<: *hardened
    image: voxzin-api:${IMAGE_TAG:-latest}
    pull_policy: never
    env_file: .env.production
    environment: { UPLOAD_DIR: /data/uploads }
    volumes: ["uploads:/data/uploads"]
    depends_on:
      redis:
        condition: service_started
      uploads-init:
        condition: service_completed_successfully
    networks: [app, data]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *hardened
    image: voxzin-worker:${IMAGE_TAG:-latest}
    pull_policy: never
    env_file: .env.production
    depends_on: [redis]
    networks: [app, data]
    mem_limit: 512m

  redis:
    <<: *hardened
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--dir", "/data"]
    volumes: ["redis-data:/data"]
    networks: [data]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }

networks:
  app: {}
  data: { internal: true }   # Redis is unreachable from outside the stack

volumes:
  uploads:
  redis-data:
